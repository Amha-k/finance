server:
  port: 8180

spring:
  application:
    name: employee-service

  config:
    import: configserver:${CONFIG_SERVER_BASE_URL:http://localhost:8888}

  jpa :
    hibernate :
      ddl-auto : update
    show-sql : true
    properties :
      hibernate :
        format_sql : true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/employee_db}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet :
    multipart :
      enabled : true
      file-size-threshold : 2KB
      max-file-size : 10MB
      max-request-size : 10MB

rabbitmq:
  employee-events-exchange: employee-exchange
  create-employee-queue: create-employee-queue
  update-employee-queue: update-employee-queue
  delete-employee-queue: delete-employee-queue

  create-resource-queue: create-employee-resource-queue
  delete-resource-queue: delete-employee-resource-queue
  change-resource-status-queue: change-employee-resource-status-queue

  publish-employee-events-job-cron: "*/5 * * * * *"

  create-promotion-queue: create-promotion-queue
  create-transfer-queue: create-transfer-queue

